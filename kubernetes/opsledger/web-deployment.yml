apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsledger-web
  labels:
    app.kubernetes.io/name: opsledger
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opsledger
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsledger
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: opsledger-regcred
      initContainers:
        - name: wait-for-database
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nslookup opsledger-db.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for database; sleep 2; done
        - name: wait-for-cache
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nslookup opsledger-cache.$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace).svc.cluster.local; do echo waiting for cache; sleep 2; done
      containers:
        - name: opsledger-web
          image: opsledger/opsledger-web:latest
          env:
            - name: OPSLEDGER_DB_USERNAME
              value: root
            - name: OPSLEDGER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsledger-secret
                  key: db-pass
            - name: OPSLEDGER_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: opsledger-secret
                  key: rmq-user
            - name: OPSLEDGER_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opsledger-secret
                  key: rmq-pass
          ports:
            - name: http
              containerPort: 8080
