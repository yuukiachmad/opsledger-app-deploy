apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsledger-cache
  labels:
    app.kubernetes.io/name: opsledger
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opsledger
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsledger
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: opsledger-cache
          image: memcached:1.6
          ports:
            - name: memcache
              containerPort: 11211
