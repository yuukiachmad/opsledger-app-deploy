apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opsledger-ingress
  labels:
    app.kubernetes.io/name: opsledger
spec:
  rules:
    - host: opsledger.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opsledger-web
                port:
                  name: http
