apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsledger-queue
  labels:
    app.kubernetes.io/name: opsledger
    app.kubernetes.io/component: queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opsledger
      app.kubernetes.io/component: queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opsledger
        app.kubernetes.io/component: queue
    spec:
      containers:
        - name: opsledger-queue
          image: rabbitmq:3-management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: rmq-user
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: rmq-pass
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
