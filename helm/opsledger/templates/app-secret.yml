{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    app.kubernetes.io/name: opsledger
type: Opaque
stringData:
  db-pass: {{ required "secret.dbPassword is required when secret.create is true" .Values.secret.dbPassword | quote }}
  rmq-user: {{ required "secret.rabbitmqUser is required when secret.create is true" .Values.secret.rabbitmqUser | quote }}
  rmq-pass: {{ required "secret.rabbitmqPassword is required when secret.create is true" .Values.secret.rabbitmqPassword | quote }}
{{- end }}
